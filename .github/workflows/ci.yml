name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build application
      run: npm run build

    - name: Run Exploit Simulation
      run: |
        # Run your simulation script
        # The '|| true' ensures the pipeline doesn't fail immediately if the script exits with an error
        bash scripts/test_dirty_cow.sh || true

    - name: Upload Exploit and Mitigation Logs
      uses: actions/upload-artifact@v4
      with:
        name: dirty-cow-logs
        path: |
          dirty_cow_exploit.log
          dirty_cow_mitigation.log
