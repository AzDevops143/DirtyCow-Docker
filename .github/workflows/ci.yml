name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build application
      run: npm run build

    - name: Run Exploit Simulation
      run: |
        # Create a directory to store our logs
        mkdir -p logs
        
        # Run your simulation script and output the result to a log file
        # The '|| true' ensures the pipeline doesn't fail immediately if the script exits with an error
        bash scripts/test_dirty_cow.sh > logs/simulation.log 2>&1 || true

    - name: Upload Logs
      uses: actions/upload-artifact@v4
      with:
        name: exploit-and-mitigation-logs
        path: logs/
