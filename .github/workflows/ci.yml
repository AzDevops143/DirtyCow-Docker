name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Run Exploit Simulation on Host (Modern Kernel)
      run: |
        bash scripts/test_dirty_cow.sh || true

    - name: Upload Host Mitigation Logs (Secure)
      uses: actions/upload-artifact@v4
      with:
        name: dirty-cow-host-logs
        path: |
          dirty_cow_exploit.log
          dirty_cow_mitigation.log
          target.txt

  exploit-test-vm:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install QEMU and Vagrant
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 qemu-utils
        
        # Install Vagrant
        curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo apt-get update && sudo apt-get install -y vagrant virtualbox
        
    - name: Create Vagrantfile for Vulnerable Environment
      run: |
        cat << 'EOF' > Vagrantfile
        Vagrant.configure("2") do |config|
          config.vm.box = "ubuntu/trusty64"
          config.vm.box_version = "20160822.0.0" 
          config.vm.synced_folder ".", "/vagrant"
          config.vm.provision "shell", inline: <<-SHELL
            echo "--- Inside VM: Kernel Version ---"
            uname -r
            cd /vagrant
            chmod +x scripts/test_dirty_cow.sh
            bash scripts/test_dirty_cow.sh
          SHELL
        end
        EOF

    - name: Run Vagrant Environment (Exploitable)
      run: |
        vagrant up
        
    - name: Upload VM Exploit Logs & Corrupted File
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vm-dirty-cow-corrupted-file
        path: |
          dirty_cow_exploit.log
          dirty_cow_mitigation.log
          target.txt

