name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Run Exploit Simulation on Host (Modern Kernel)
      run: |
        bash scripts/test_dirty_cow.sh || true

    - name: Upload Host Mitigation Logs (Secure)
      uses: actions/upload-artifact@v4
      with:
        name: dirty-cow-host-logs
        path: |
          dirty_cow_exploit.log
          dirty_cow_mitigation.log
          target.txt

